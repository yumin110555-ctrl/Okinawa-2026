<div v-if="item.isFlightSummary" class="flight-card-bg p-7 rounded-[2.5rem] text-white my-4 relative overflow-hidden">
    <div class="flex justify-between items-center mb-6 opacity-80 font-bold">
        <span>{{ item.airline }}</span>
        <span>{{ item.flightNo }}</span>
    </div>
    <div class="flex justify-between items-center text-center relative z-10">
        <div class="flex-1">
            <h4 class="text-4xl font-black font-times tracking-tighter">{{ item.from }}</h4>
            <p class="text-xl font-bold font-times text-sky-200 mt-2">{{ item.depTime }}</p>
        </div>
        <div class="px-4">
            <img src="https://sp-file.s3.amazonaws.com/1744370889988_380026.jpg" class="w-10 h-auto invert brightness-0" style="filter: brightness(0) invert(1);" alt="plane">
        </div>
        <div class="flex-1">
            <h4 class="text-4xl font-black font-times tracking-tighter">{{ item.to }}</h4>
            <p class="text-xl font-bold font-times text-sky-200 mt-2">{{ item.arrTime }}</p>
        </div>
    </div>
</div>

<section v-else key="info" class="px-6 py-8 space-y-8 pb-20">
    <div class="bg-white border border-sky-100 rounded-[2.5rem] p-7 shadow-sm">
        <h2 class="text-2xl font-black text-sky-600 flex items-center gap-3 mb-6">
            <i data-lucide="plane" class="w-7 h-7"></i> 航班資訊
        </h2>
        </div>

    <div class="bg-white border border-sky-100 rounded-[2.5rem] p-7 shadow-sm">
        <h2 class="text-2xl font-black text-sky-600 flex items-center gap-3 mb-6">
            <i data-lucide="car" class="w-7 h-7"></i> 租車資訊
        </h2>
        <div class="flex justify-between items-start mb-4">
            <div class="space-y-2">
                <p class="font-black text-2xl text-slate-800">FLIGHT RENTACAR</p>
                <p class="text-lg font-bold text-slate-500">編號：<span class="font-times select-all">{{ rentalData.id }}</span></p>
            </div>
            <button @click="openNav('FLIGHT RENTACAR')" class="nav-btn w-14 h-14 rounded-full bg-white flex items-center justify-center text-sky-500 shrink-0">
                <i data-lucide="navigation" class="w-7 h-7"></i>
            </button>
        </div>
        </div>

    <div class="bg-white border border-sky-100 rounded-[2.5rem] p-7 shadow-sm">
        <h2 class="text-2xl font-black text-sky-600 flex items-center gap-3 mb-6">
            <i data-lucide="hotel" class="w-7 h-7"></i> 住宿資訊
        </h2>
        </div>
</section>
